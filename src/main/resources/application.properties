# 1. Identificación del Microservicio
spring.application.name=ms-usuarios
server.port=${SERVER_PORT:8085}

# 2. Configuración de la Base de Datos (PostgreSQL - AWS RDS)
spring.datasource.url=jdbc:postgresql://fireforce.c1w28coqqryx.us-east-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=Fireforce
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Ajustes de Spring
spring.main.allow-bean-definition-overriding=true
spring.cloud.config.enabled=false

# 5. Configuración de Logs
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

# 6. JWT Secret
app.jwt.secret=bXlTdXBlclNlY3JldEtleTEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MA==
app.jwt.expiration=86400000

# 7. Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.loginCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.loginCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.loginCB.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.loginCB.permitted-number-of-calls-in-half-open-state=3